[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-review-benchmark"
version = "0.1.0"
description = "Anonymous CAD benchmark reproduction artifact"
requires-python = ">=3.11"
dependencies = ["cadquery==2.7.0", "numpy>=2.0,<3", "scipy>=1.13,<2", "requests>=2.32,<3", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cad-review = "review_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
